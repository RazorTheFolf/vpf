application:
  name: Virtual Photo Frame
  version: 0.1.0
  id: dev.razor.vpf

render:
  show_cursor: true
  render_fullscreen: true
  window_width: 1280
  window_height: 720

slideshow:
  source: immich # immich | local (photos in the assets folder)
  slide_duration: 3 # seconds
  placeholder_text: Loading image, please wait...
  placeholder_text_scale: 2.0

immich:
  url: "http://localhost:2283"
  api_key: your-immich-api-key
  album_id: your-album-id
